# Baseline reusable workflow for Gradle repositories.
#
# Contract: scanners NEVER fail. They emit SARIF and carry on. The decision to
# block belongs exclusively to the `gate` job, which is the only required check
# in the ruleset. That way the policy can change without touching the scanners.
name: baseline · jvm-gradle

on:
  workflow_call:
    inputs:
      java-version:   { type: string, default: '21' }
      severity-gate:  { type: string, default: 'high' }
      cutoff-date:    { type: string, default: '' }
      run-container:  { type: boolean, default: false }
      run-iac:        { type: boolean, default: false }

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan stages
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        uses: pixelotes/ci-security-baseline/actions/plan-stages@v1

  build:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',build,')
    name: build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
      - uses: pixelotes/ci-security-baseline/actions/setup-cache@v1
        with: { stack: jvm-gradle }
      - name: Build and run tests
        run: |
          GRADLE=gradle; [ -x ./gradlew ] && GRADLE=./gradlew
          "$GRADLE" --no-daemon build
      - name: Publish coverage on the PR
        if: always()
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        continue-on-error: true
        with:
          paths: '**/build/reports/jacoco/**/*.xml'
          token: ${{ github.token }}
          title: Coverage

  lint:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',lint,')
    name: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # the linter flags quality; the gate flags risk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { java-version: '${{ inputs.java-version }}', distribution: temurin }
      - uses: pixelotes/ci-security-baseline/actions/lint-jvm@v1
        with: { build-tool: gradle }

  sast:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sast,')
    name: opengrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-opengrep@v1
        with: { config: 'p/ci p/java p/secrets' }

  secrets:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',secret-scan,')
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/scan-gitleaks@v1

  sca:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sca,')
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-osv@v1

  container:
    name: dockerfile + image
    if: inputs.run-container
    uses: pixelotes/ci-security-baseline/.github/workflows/ci-container.yml@v1

  iac:
    name: iac
    if: inputs.run-iac
    uses: pixelotes/ci-security-baseline/.github/workflows/ci-iac.yml@v1

  quality:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',quality,')
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: it never fails the run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-quality@v1

  gate:
    name: gate
    needs: [plan, build, lint, sast, secrets, sca, quality, container, iac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the stage plan is invalid
        if: needs.plan.result != 'success'
        run: |
          echo "::error::The stage plan failed (see the 'plan stages' job): refusing to pass"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # the gate needs history for git blame
      - uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
