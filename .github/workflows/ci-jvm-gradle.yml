# Reusable workflow del baseline para repositorios Gradle.
#
# Contrato: los escáneres NUNCA fallan. Emiten SARIF y siguen. La decisión de
# bloquear es exclusiva del job `gate`, que es el único required check del
# ruleset. Así se cambia la política sin tocar los escáneres.
name: baseline · jvm-gradle

on:
  workflow_call:
    inputs:
      java-version:   { type: string, default: '21' }
      severity-gate:  { type: string, default: 'high' }
      cutoff-date:    { type: string, default: '' }
      run-container:  { type: boolean, default: false }
      run-iac:        { type: boolean, default: false }

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
      - uses: pixelotes/composite-actions/actions/setup-cache@v1
        with: { stack: jvm-gradle }
      - name: Compilar y pasar tests
        run: |
          GRADLE=gradle; [ -x ./gradlew ] && GRADLE=./gradlew
          "$GRADLE" --no-daemon build
      - name: Publicar cobertura en el PR
        if: always()
        uses: madrapps/jacoco-report@v1.7.1
        continue-on-error: true
        with:
          paths: '**/build/reports/jacoco/**/*.xml'
          token: ${{ github.token }}
          title: Cobertura

  lint:
    name: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # el linter señala calidad; el gate señala riesgo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '${{ inputs.java-version }}', distribution: temurin }
      - uses: pixelotes/composite-actions/actions/lint-jvm@v1
        with: { build-tool: gradle }

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pixelotes/composite-actions/actions/scan-semgrep@v1
        with: { config: 'p/ci p/java p/secrets' }

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pixelotes/composite-actions/actions/scan-gitleaks@v1

  sca:
    name: trivy fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pixelotes/composite-actions/actions/scan-trivy-fs@v1

  container:
    name: dockerfile + imagen
    if: inputs.run-container
    uses: ./.github/workflows/ci-container.yml

  iac:
    name: iac
    if: inputs.run-iac
    uses: ./.github/workflows/ci-iac.yml

  gate:
    name: gate
    needs: [build, lint, sast, secrets, sca]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # el gate necesita historial para git blame
      - uses: pixelotes/composite-actions/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
