# Lightweight module.
name: baseline · go

on:
  workflow_call:
    inputs:
      go-version:    { type: string, default: '' }   # empty = read it from go.mod
      severity-gate: { type: string, default: 'high' }
      cutoff-date:   { type: string, default: '' }
      run-container:   { type: boolean, default: false }
      run-iac:         { type: boolean, default: false }

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan stages
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        uses: pixelotes/ci-security-baseline/actions/plan-stages@v1

  build:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',build,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: true
      - run: go build ./...
      - run: go test ./... -race

  lint:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',lint,')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        continue-on-error: true   # findings are informational: do not turn the job red
        with: { version: latest, args: "--enable=gocyclo,gocognit,dupl,gocritic" }

  sast:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sast,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-opengrep@v1
        with: { config: 'p/ci p/golang p/secrets' }

  secrets:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',secret-scan,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/scan-gitleaks@v1

  sca:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sca,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-osv@v1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: true
      - uses: pixelotes/ci-security-baseline/actions/scan-govulncheck@v1

  container:
    name: dockerfile + image
    if: inputs.run-container
    uses: pixelotes/ci-security-baseline/.github/workflows/ci-container.yml@v1

  iac:
    name: iac
    if: inputs.run-iac
    uses: pixelotes/ci-security-baseline/.github/workflows/ci-iac.yml@v1

  quality:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',quality,')
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: it never fails the run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-quality@v1

  gate:
    needs: [plan, build, lint, sast, secrets, sca, quality, container, iac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the stage plan is invalid
        if: needs.plan.result != 'success'
        run: |
          echo "::error::The stage plan failed (see the 'plan stages' job): refusing to pass"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
