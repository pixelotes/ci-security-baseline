# Módulo ligero.
name: baseline · go

on:
  workflow_call:
    inputs:
      go-version:    { type: string, default: '1.23' }
      severity-gate: { type: string, default: 'high' }
      cutoff-date:   { type: string, default: '' }

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '${{ inputs.go-version }}', cache: true }
      - run: go build ./...
      - run: go test ./... -race

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: latest }

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/composite-actions/actions/scan-semgrep@v1
        with: { config: 'p/ci p/golang p/secrets' }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/composite-actions/actions/scan-gitleaks@v1

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/composite-actions/actions/scan-trivy-fs@v1

  gate:
    needs: [build, lint, sast, secrets, sca]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/composite-actions/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
