# What does not fit in the PR's 10-minute budget.
#
# This is where the full secrets history (verified TruffleHog), the re-scan of
# images already published to ACR and the exhaustive SCA go. With 3,000
# included minutes per month, this is what keeps the PR cheap.
name: baseline · nightly deep scan

on:
  workflow_call:
    inputs:
      registry:  { type: string, default: '' }
      images:    { type: string, default: '' }   # comma-separated list
      severity-gate: { type: string, default: 'critical' }
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  secrets-history:
    name: trufflehog (history, verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/scan-trufflehog@v1

  sca-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-trivy-fs@v1
        with: { scanners: 'vuln,secret,license,misconfig' }

  registry-rescan:
    name: re-scan of published images
    if: inputs.images != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(format('[{0}]', inputs.images)) }}
    steps:
      - uses: pixelotes/ci-security-baseline/actions/scan-trivy-image@v1
        with: { image: '${{ inputs.registry }}/${{ matrix.image }}' }

  report:
    needs: [secrets-history, sca-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: gate
        continue-on-error: true
        uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          comment-pr: 'false'
      - name: Open an incident if there are blockers
        if: steps.gate.outputs.passed == 'false'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Security baseline · critical findings in the nightly scan"
          content-filepath: reports/gate-summary.md
          labels: security,nightly
