# Terraform, Helm, Kubernetes y Ansible. Igual que container, es un módulo
# aditivo, no una alternativa.
name: baseline · iac

on:
  workflow_call:
    inputs:
      standalone:    { type: boolean, default: false }
      severity-gate: { type: string, default: 'high' }
      cutoff-date:   { type: string, default: '' }

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: pixelotes/ci-security-baseline/actions/lint-iac@v1

  policy:
    name: checkov + trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-checkov@v1
      - uses: pixelotes/ci-security-baseline/actions/scan-trivy-fs@v1
        with: { scanners: 'misconfig,secret' }

  gate:
    if: always() && inputs.standalone
    needs: [lint, policy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
