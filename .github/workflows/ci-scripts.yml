# Shell y PowerShell suelen quedarse sin cobertura de lint. Coste casi nulo,
# cobertura inmediata.
name: baseline · scripts

on:
  workflow_call:
    inputs:
      standalone:    { type: boolean, default: false }
      severity-gate: { type: string, default: 'high' }
      cutoff-date:   { type: string, default: '' }

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: __ORG__/__REPO__/actions/lint-scripts@v1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: __ORG__/__REPO__/actions/scan-gitleaks@v1

  gate:
    if: always() && inputs.standalone
    needs: [lint, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: __ORG__/__REPO__/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
