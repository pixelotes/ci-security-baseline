# Shell and PowerShell usually go without lint coverage. Almost no cost,
# immediate coverage.
name: baseline · scripts

on:
  workflow_call:
    inputs:
      standalone:    { type: boolean, default: false }
      severity-gate: { type: string, default: 'high' }
      cutoff-date:   { type: string, default: '' }

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan stages
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        uses: pixelotes/ci-security-baseline/actions/plan-stages@v1

  lint:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',lint,')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/lint-scripts@v1

  secrets:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',secret-scan,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/scan-gitleaks@v1

  gate:
    if: always() && inputs.standalone
    needs: [plan, lint, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the stage plan is invalid
        if: needs.plan.result != 'success'
        run: |
          echo "::error::The stage plan failed (see the 'plan stages' job): refusing to pass"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
