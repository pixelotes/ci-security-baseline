# Reusable workflow del baseline para repositorios Maven.
#
# Contrato: los escáneres NUNCA fallan. Emiten SARIF y siguen. La decisión de
# bloquear es exclusiva del job `gate`, que es el único required check del
# ruleset. Así se cambia la política sin tocar los escáneres.
name: baseline · jvm-maven

on:
  workflow_call:
    inputs:
      java-version:   { type: string, default: '21' }
      severity-gate:  { type: string, default: 'high' }
      cutoff-date:    { type: string, default: '' }
      run-container:  { type: boolean, default: false }
      run-iac:        { type: boolean, default: false }

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan stages
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        uses: pixelotes/ci-security-baseline/actions/plan-stages@v1

  build:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',build,')
    name: build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
      - uses: pixelotes/ci-security-baseline/actions/setup-cache@v1
        with: { stack: jvm-maven }
      - name: Compilar y pasar tests
        # El wrapper se usa si el repo lo trae; si no, el maven del runner.
        run: |
          MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw
          "$MVN" -B verify
      - name: Publicar cobertura en el PR
        if: always()
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        continue-on-error: true
        with:
          paths: '**/target/site/jacoco/jacoco.xml'
          token: ${{ github.token }}
          title: Cobertura

  lint:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',lint,')
    name: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # el linter señala calidad; el gate señala riesgo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { java-version: '${{ inputs.java-version }}', distribution: temurin }
      - uses: pixelotes/ci-security-baseline/actions/lint-jvm@v1
        with: { build-tool: maven }

  sast:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sast,')
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-semgrep@v1
        with: { config: 'p/ci p/java p/secrets' }

  secrets:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',secret-scan,')
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/scan-gitleaks@v1

  sca:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sca,')
    name: trivy fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-trivy-fs@v1

  container:
    name: dockerfile + imagen
    if: inputs.run-container
    uses: ./.github/workflows/ci-container.yml

  iac:
    name: iac
    if: inputs.run-iac
    uses: ./.github/workflows/ci-iac.yml

  codeql:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',codeql,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-codeql@v1
        with:
          languages: java-kotlin

  gate:
    name: gate
    needs: [plan, build, lint, sast, secrets, sca, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the stage plan is invalid
        if: needs.plan.result != 'success'
        run: |
          echo "::error::The stage plan failed (see the 'plan stages' job): refusing to pass"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # el gate necesita historial para git blame
      - uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
