# Muchos repos Python no tienen pyproject.toml en la raíz: los requirements
# viven en subdirectorios. El módulo descubre ficheros; no asume rutas.
name: baseline · python

on:
  workflow_call:
    inputs:
      python-version: { type: string, default: '3.12' }
      severity-gate:  { type: string, default: 'high' }
      cutoff-date:    { type: string, default: '' }
      run-container:  { type: boolean, default: false }

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan stages
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        uses: pixelotes/ci-security-baseline/actions/plan-stages@v1

  build:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',build,')
    name: install + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Instalar dependencias (descubrimiento, no ruta fija)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            pip install -e '.[dev]' 2>/dev/null || pip install -e . || true
          fi
          # muchos repos del parque tienen requirements en subdirectorios
          while IFS= read -r req; do
            echo "→ $req"
            pip install -r "$req" || true
          done < <(find . -maxdepth 3 -name 'requirements*.txt' -not -path './.git/*')
      - run: pytest -q || echo "::warning::sin tests o tests fallando"

  lint:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',lint,')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '${{ inputs.python-version }}' }
      - uses: pixelotes/ci-security-baseline/actions/lint-python@v1

  sast:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sast,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # p/python incluye las reglas ex-bandit, que en el linter solo avisan
      # y aquí sí cuentan para el gate.
      - uses: pixelotes/ci-security-baseline/actions/scan-semgrep@v1
        with: { config: 'p/ci p/python p/secrets' }

  secrets:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',secret-scan,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/scan-gitleaks@v1

  sca:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',sca,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-trivy-fs@v1

  codeql:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',codeql,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/scan-codeql@v1
        with:
          languages: python

  gate:
    needs: [plan, build, lint, sast, secrets, sca, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the stage plan is invalid
        if: needs.plan.result != 'success'
        run: |
          echo "::error::The stage plan failed (see the 'plan stages' job): refusing to pass"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
