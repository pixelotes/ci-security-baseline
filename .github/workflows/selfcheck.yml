# Ola 0 del despliegue: el baseline se aplica a sí mismo antes de pedírselo
# a nadie. Si el gate no puede pasar aquí, no está listo para el resto de la organización.
name: selfcheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validar-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet yamllint
      - run: yamllint -d relaxed .github/ actions/ policy/

  probar-gate:
    name: tests del gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml pytest
      - run: python -m pytest tests/ -q

  baseline:
    uses: ./.github/workflows/ci-scripts.yml
    with:
      standalone: true
      severity-gate: high
