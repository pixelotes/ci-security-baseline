# Wave 0 of the rollout: the baseline applies itself before asking anyone else
# to. If the gate cannot pass here, it is not ready for the rest of the organization.
name: selfcheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validar-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install --quiet yamllint
      - run: yamllint -d relaxed .github/ actions/ policy/

  probar-gate:
    name: gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: pip install --quiet pyyaml pytest
      - run: python -m pytest tests/ -q

  baseline:
    uses: ./.github/workflows/ci-scripts.yml
    with:
      standalone: true
      severity-gate: high
