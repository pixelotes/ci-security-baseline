# NOT an alternative to the language modules: it is an addition. A Java repo
# with a Dockerfile and charts calls all three, and the gate runs only once,
# consuming the artifacts of all of them.
name: baseline · container

on:
  workflow_call:
    inputs:
      dockerfile:   { type: string, default: 'Dockerfile' }
      context:      { type: string, default: '.' }
      image-name:   { type: string, default: '' }
      standalone:
        type: boolean
        default: false
        description: 'true if this module runs on its own and must run the gate'
      severity-gate: { type: string, default: 'high' }
      cutoff-date:   { type: string, default: '' }

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    name: plan stages
    runs-on: ubuntu-latest
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        uses: pixelotes/ci-security-baseline/actions/plan-stages@v1

  lint:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',lint,')
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pixelotes/ci-security-baseline/actions/lint-docker@v1

  scan:
    needs: plan
    if: contains(needs.plan.outputs.stages, ',container-scan,')
    name: build + trivy image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (without publishing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: local/scan:${{ github.sha }}
          # without layer caching this module is the most expensive in the whole baseline
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: pixelotes/ci-security-baseline/actions/scan-trivy-image@v1
        with: { image: 'local/scan:${{ github.sha }}' }

  gate:
    if: always() && inputs.standalone
    needs: [plan, lint, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the stage plan is invalid
        if: needs.plan.result != 'success'
        run: |
          echo "::error::The stage plan failed (see the 'plan stages' job): refusing to pass"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pixelotes/ci-security-baseline/actions/gate@v1
        with:
          severity: ${{ inputs.severity-gate }}
          cutoff: ${{ inputs.cutoff-date }}
