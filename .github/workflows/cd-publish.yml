# CD: publishing with a verifiable supply chain.
#
# The contract differs from CI: there is no time budget here, there is a
# traceability budget. Every publication leaves an SBOM, an inventory in
# Dependency-Track and a signature.
name: baseline · cd publish

on:
  workflow_call:
    inputs:
      stack:            { type: string, required: true }   # jvm-maven | node | python | container
      artifact-name:    { type: string, required: true }
      version:          { type: string, required: true }
      environment:      { type: string, default: 'prod' }
      registry:         { type: string, default: '' }      # e.g. myorg.azurecr.io
      dtrack-url:       { type: string, required: true }
      keyvault:         { type: string, required: true }
      cosign-key-uri:   { type: string, default: '' }
      sign-method:      { type: string, default: 'cosign-kms' }
      dtrack-fail-on:   { type: string, default: 'high' }
    secrets:
      AZURE_CLIENT_ID:       { required: true }
      AZURE_TENANT_ID:       { required: true }
      AZURE_SUBSCRIPTION_ID: { required: true }

permissions:
  contents: read
  id-token: write        # OIDC to Entra ID — only here, never in CI
  attestations: write

jobs:
  publish:
    # The environment is what makes the OIDC scoping real: the federated
    # credential is scoped to repo:ORG/REPO:environment:<this one>, and the
    # environment has required reviewers.
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC) and Key Vault read
        uses: pixelotes/ci-security-baseline/actions/azure-login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          keyvault: ${{ inputs.keyvault }}
          secrets: 'dtrack-api-key'

      - name: Build artifact
        id: build
        run: |
          set -euo pipefail
          case "${{ inputs.stack }}" in
            jvm-maven) MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw; "$MVN" -B -DskipTests package ;;
            node)      npm ci && npm run build --if-present ;;
            python)    pip install build && python -m build ;;
            container)
              az acr login --name "$(echo '${{ inputs.registry }}' | cut -d. -f1)"
              docker build -t "${{ inputs.registry }}/${{ inputs.artifact-name }}:${{ inputs.version }}" .
              ;;
          esac

      - name: SBOM (CycloneDX)
        id: sbom
        uses: pixelotes/ci-security-baseline/actions/sbom-syft@v1
        with:
          source: ${{ inputs.stack == 'container' && format('{0}/{1}:{2}', inputs.registry, inputs.artifact-name, inputs.version) || '.' }}
          name: ${{ inputs.artifact-name }}

      - name: Dependency-Track — inventory and policy gate
        uses: pixelotes/ci-security-baseline/actions/dtrack-upload@v1
        with:
          sbom: ${{ steps.sbom.outputs.path }}
          project-name: ${{ github.event.repository.name }}
          project-version: ${{ inputs.version }}
          base-url: ${{ inputs.dtrack-url }}
          api-key: ${{ env.dtrack_api_key }}
          fail-on: ${{ inputs.dtrack-fail-on }}

      - name: Publish
        run: |
          set -euo pipefail
          case "${{ inputs.stack }}" in
            container)
              docker push "${{ inputs.registry }}/${{ inputs.artifact-name }}:${{ inputs.version }}" ;;
            jvm-maven)
              MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw; "$MVN" -B -DskipTests deploy ;;
            node)
              npm publish ;;                                        # Azure Artifacts
            python)
              pip install twine && twine upload dist/* ;;
          esac

      - name: Sign
        if: inputs.stack == 'container'
        uses: pixelotes/ci-security-baseline/actions/sign-artifact@v1
        with:
          target: ${{ inputs.registry }}/${{ inputs.artifact-name }}:${{ inputs.version }}
          method: ${{ inputs.sign-method }}
          key-uri: ${{ inputs.cosign-key-uri }}

      - name: Verify what was published before promoting
        if: inputs.stack == 'container'
        run: |
          set -euo pipefail
          IMG="${{ inputs.registry }}/${{ inputs.artifact-name }}:${{ inputs.version }}"
          cosign verify --key "${{ inputs.cosign-key-uri }}" "$IMG"
          trivy image --severity CRITICAL,HIGH --exit-code 1 "$IMG"
