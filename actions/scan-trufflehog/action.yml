name: 'TruffleHog (history, verified only)'
description: >
  Full history with --only-verified: it checks the credential against the
  provider. A verified finding is true by definition, so this one does block
  and opens an incident. It runs in the nightly, not in the PR.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports
        docker run --rm -v "$PWD:/repo" ghcr.io/trufflesecurity/trufflehog:latest \
          git file:///repo --only-verified --json > reports/trufflehog.json || true
        python3 "${{ github.action_path }}/to_sarif.py" \
          reports/trufflehog.json reports/trufflehog.sarif
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: sarif-trufflehog, path: reports/trufflehog.sarif, if-no-files-found: warn, retention-days: 1 }
