name: 'Opengrep (SAST)'
description: >
  Baseline SAST with Opengrep (community fork of Semgrep CE). Single binary
  with a pinned checksum: it installs neither Python nor dependencies. Emits
  SARIF and never fails on its own: the gate decides.
inputs:
  config:
    description: 'Additional rulesets, space-separated'
    default: 'p/ci p/secrets'
runs:
  using: composite
  steps:
    - name: Install Opengrep (pinned version and checksum)
      shell: bash
      env:
        VERSION: v1.33.1
        SHA256: 46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        curl -sSfL -o "$RUNNER_TEMP/bin/opengrep" \
          "https://github.com/opengrep/opengrep/releases/download/${VERSION}/opengrep_manylinux_x86"
        echo "${SHA256}  $RUNNER_TEMP/bin/opengrep" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/bin/opengrep"
    - shell: bash
      env:
        CONFIGS: ${{ inputs.config }}
      run: |
        mkdir -p reports
        ARGS=()
        for c in $CONFIGS; do ARGS+=(--config "$c"); done
        # No --error on purpose: the gate sets the cut-off, not the scanner.
        # Opengrep sends no telemetry, so there is no --metrics flag.
        "$RUNNER_TEMP/bin/opengrep" scan --quiet \
          --sarif --output reports/opengrep.sarif \
          "${ARGS[@]}" \
          --config "${{ github.action_path }}/../../policy/semgrep" \
          . || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: sarif-opengrep, path: reports/opengrep.sarif, if-no-files-found: warn, retention-days: 1 }
