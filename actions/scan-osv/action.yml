name: 'OSV-Scanner (SCA)'
description: >
  Dependency vulnerabilities from the lockfiles, using OSV-Scanner. Single
  binary with a pinned checksum, no database to cache. Emits SARIF and never
  fails on its own: the gate decides.

  Privacy: by default it queries the osv.dev API with package names and
  versions (not your code). In repos with sensitive internal dependencies,
  use offline: true.
inputs:
  offline:
    description: 'Downloads the databases and queries locally (slower)'
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install OSV-Scanner (pinned version and checksum)
      shell: bash
      env:
        VERSION: v2.7.1
        SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        curl -sSfL -o "$RUNNER_TEMP/bin/osv-scanner" \
          "https://github.com/google/osv-scanner/releases/download/${VERSION}/osv-scanner_linux_amd64"
        echo "${SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/bin/osv-scanner"
    - shell: bash
      env:
        OFFLINE: ${{ inputs.offline }}
      run: |
        mkdir -p reports
        FLAGS=()
        if [ "$OFFLINE" = "true" ]; then
          FLAGS+=(--offline-vulnerabilities --download-offline-databases)
        fi
        # Exits with code 1 when there are findings: the gate sets the cut-off.
        "$RUNNER_TEMP/bin/osv-scanner" scan source -r "${FLAGS[@]}" \
          --format sarif --output-file reports/osv.sarif . || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: sarif-osv, path: reports/osv.sarif, if-no-files-found: warn, retention-days: 1 }
