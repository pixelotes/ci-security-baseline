name: 'SBOM with Syft'
description: 'Generates a CycloneDX 1.6 SBOM of the artifact or image.'
inputs:
  source: { description: 'Path or image reference', default: '.' }
  name:   { description: 'Base file name', default: 'sbom' }
outputs:
  path: { description: 'Path of the generated SBOM', value: 'reports/${{ inputs.name }}.cdx.json' }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
          | sh -s -- -b /usr/local/bin
        syft "${{ inputs.source }}" \
          -o cyclonedx-json="reports/${{ inputs.name }}.cdx.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-${{ inputs.name }}
        path: reports/${{ inputs.name }}.cdx.json
        retention-days: 90
