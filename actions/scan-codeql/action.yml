name: 'CodeQL (SAST, opt-in)'
description: >
  Runs a CodeQL analysis and leaves the SARIF for the gate instead of uploading
  it to Code Scanning, so it works the same in the gate pipeline. Opt-in stage
  (`codeql`).

  License: CodeQL is free for public repositories. Running it on private
  repositories requires GitHub Code Security.
inputs:
  languages:
    description: 'CodeQL language: python | go | javascript-typescript | java-kotlin | actions'
    required: true
  build-mode:
    description: 'none | autobuild (Go needs autobuild)'
    default: 'none'
  queries:
    description: 'Query suite: default | security-extended | security-and-quality'
    default: 'security-extended'
runs:
  using: composite
  steps:
    - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ inputs.languages }}
        build-mode: ${{ inputs.build-mode }}
        queries: ${{ inputs.queries }}
    - if: inputs.build-mode == 'autobuild'
      uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
    - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: baseline-${{ inputs.languages }}
        output: reports/codeql
        upload: never
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: sarif-codeql
        path: reports/codeql/*.sarif
        if-no-files-found: warn
