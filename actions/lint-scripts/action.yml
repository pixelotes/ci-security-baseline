name: 'Lint scripts'
description: >
  shellcheck and PSScriptAnalyzer. Shell and PowerShell usually fall outside
  any lint coverage, and the cost of adding them is almost nil.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -uo pipefail
        mapfile -t SH < <(find . -name '*.sh' -not -path './.git/*')
        if [ ${#SH[@]} -gt 0 ]; then
          sudo apt-get install -y shellcheck >/dev/null 2>&1 || true
          shellcheck -S warning "${SH[@]}" || echo "::warning::shellcheck has findings"
        fi
    - shell: pwsh
      run: |
        $files = Get-ChildItem -Recurse -Filter *.ps1 -ErrorAction SilentlyContinue
        if ($files) {
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error | Format-Table
        }
