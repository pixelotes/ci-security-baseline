name: 'Lint Dockerfile'
description: 'hadolint over every Dockerfile in the repo. Emits SARIF.'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -uo pipefail
        mkdir -p reports
        curl -sSfL -o /usr/local/bin/hadolint \
          https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
        chmod +x /usr/local/bin/hadolint
        find . -name 'Dockerfile*' -not -path './.git/*' -print0 \
          | xargs -0 -r hadolint --format sarif > reports/hadolint.sarif || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: sarif-hadolint, path: reports/hadolint.sarif, if-no-files-found: warn, retention-days: 1 }
