name: 'Dependency-Track: upload SBOM and evaluate policy'
description: >
  Uploads the CycloneDX SBOM to Dependency-Track and queries its policy
  violations. This is the dependency gate in CD: it has VEX context, history
  and an owner, not just a number like a Trivy threshold.

  Dependency-Track is also the replacement for the half of Xray that Azure
  Artifacts does not cover: continuous re-evaluation of already published
  artifacts.
inputs:
  sbom:            { description: 'Path to the CycloneDX SBOM', required: true }
  project-name:    { description: 'Project name in DT', required: true }
  project-version: { description: 'Version (tag)', required: true }
  base-url:        { description: 'Dependency-Track URL', required: true }
  api-key:         { description: 'DT API key (from Key Vault)', required: true }
  fail-on:         { description: 'critical | high | medium | none', default: 'high' }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DT_URL: ${{ inputs.base-url }}
        DT_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        echo "Uploading SBOM to Dependency-Track…"
        TOKEN=$(curl -sSf -X POST "$DT_URL/api/v1/bom" \
          -H "X-Api-Key: $DT_KEY" \
          -F "autoCreate=true" \
          -F "projectName=${{ inputs.project-name }}" \
          -F "projectVersion=${{ inputs.project-version }}" \
          -F "bom=@${{ inputs.sbom }}" | jq -r '.token')

        echo "Waiting for processing (token $TOKEN)…"
        for _ in $(seq 1 60); do
          PROC=$(curl -sSf "$DT_URL/api/v1/bom/token/$TOKEN" -H "X-Api-Key: $DT_KEY" | jq -r '.processing')
          [ "$PROC" = "false" ] && break
          sleep 5
        done

        UUID=$(curl -sSf -G "$DT_URL/api/v1/project/lookup" -H "X-Api-Key: $DT_KEY" \
          --data-urlencode "name=${{ inputs.project-name }}" \
          --data-urlencode "version=${{ inputs.project-version }}" | jq -r '.uuid')

        mkdir -p reports
        curl -sSf "$DT_URL/api/v1/violation/project/$UUID" -H "X-Api-Key: $DT_KEY" \
          > reports/dtrack-violations.json

        curl -sSf "$DT_URL/api/v1/finding/project/$UUID" -H "X-Api-Key: $DT_KEY" \
          > reports/dtrack-findings.json

        python3 "${{ github.action_path }}/evaluate.py" \
          --violations reports/dtrack-violations.json \
          --findings   reports/dtrack-findings.json \
          --fail-on    "${{ inputs.fail-on }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: dtrack-report, path: reports/dtrack-*.json, if-no-files-found: warn }
