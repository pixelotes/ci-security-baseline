name: 'Sign artifact'
description: >
  Signs with cosign using a key in Key Vault (azurekms://) or with Notation.

  Keyless cosign with the Actions OIDC would be more convenient, but it
  publishes the repository identity in the public Rekor log: names of
  internal and customer repos, exposed. In a fleet with customer
  repositories, that is not acceptable.
inputs:
  target:   { required: true, description: 'Image reference or file path' }
  method:   { default: 'cosign-kms', description: 'cosign-kms | notation' }
  key-uri:  { default: '', description: 'azurekms://VAULT.vault.azure.net/KEY' }
  cert-id:  { default: '', description: 'Signing certificate for Notation' }
runs:
  using: composite
  steps:
    - if: inputs.method == 'cosign-kms'
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - if: inputs.method == 'cosign-kms'
      shell: bash
      run: |
        set -euo pipefail
        cosign sign --yes --key "${{ inputs.key-uri }}" "${{ inputs.target }}"
    - if: inputs.method == 'notation'
      shell: bash
      run: |
        set -euo pipefail
        # Native ACR path: verified from AKS by policy.
        az acr login --name "$(echo "${{ inputs.target }}" | cut -d. -f1)"
        notation sign --key "${{ inputs.cert-id }}" "${{ inputs.target }}"
