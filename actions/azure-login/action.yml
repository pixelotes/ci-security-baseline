name: 'Azure login via OIDC'
description: >
  Federated authentication against Entra ID. No secrets are injected into the
  repository: the whole perimeter is the subject of the federated credential,
  which must be scoped to an environment (repo:ORG/REPO:environment:prod) and
  never use a wildcard — otherwise a workflow triggered by a PR gets a
  production token.
inputs:
  client-id:       { required: true, description: 'App registration' }
  tenant-id:       { required: true, description: 'Entra ID tenant' }
  subscription-id: { required: true, description: 'Subscription' }
  keyvault:        { required: false, default: '', description: 'Key Vault to read secrets from' }
  secrets:         { required: false, default: '', description: 'Comma-separated names' }
runs:
  using: composite
  steps:
    - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
    - if: inputs.keyvault != '' && inputs.secrets != ''
      shell: bash
      run: |
        set -euo pipefail
        IFS=',' read -ra NAMES <<< "${{ inputs.secrets }}"
        for n in "${NAMES[@]}"; do
          n="$(echo "$n" | xargs)"
          v=$(az keyvault secret show --vault-name "${{ inputs.keyvault }}" --name "$n" --query value -o tsv)
          echo "::add-mask::$v"
          echo "${n//-/_}=$v" >> "$GITHUB_ENV"
        done
