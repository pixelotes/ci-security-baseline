name: 'Lint Python'
description: >
  Ruff replaces flake8, isort, pylint and black. The security rules
  (ruff S*, ex-bandit) are promoted to the SAST, where they do block.
runs:
  using: composite
  steps:
    - shell: bash
      run: pip install --quiet ruff mypy
    - shell: bash
      run: |
        # C90/SIM/PLR09xx: complexity, simplifications and oversized functions (smells)
        ruff check --extend-select C90,SIM,PLR0911,PLR0912,PLR0913,PLR0915 --output-format=github . || echo "::warning::ruff has findings"
        ruff format --check . || echo "::warning::formatting pending"
        mypy --ignore-missing-imports . || echo "::warning::mypy has findings"
