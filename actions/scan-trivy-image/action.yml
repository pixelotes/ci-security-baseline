name: 'Trivy image'
description: 'Vulnerabilities, secrets and misconfig on the built image.'
inputs:
  image: { description: 'Image reference', required: true }
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ github.run_id }}
        restore-keys: trivy-db-
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image }}
        scanners: 'vuln,secret,misconfig'
        format: sarif
        output: reports/trivy-image.sarif
        exit-code: '0'
        cache-dir: ~/.cache/trivy
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: sarif-trivy-image, path: reports/trivy-image.sarif, if-no-files-found: warn, retention-days: 1 }
