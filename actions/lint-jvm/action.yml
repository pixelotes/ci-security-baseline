name: 'Lint JVM'
description: 'Checkstyle, PMD and Spotless for Maven; detekt and ktlint for Kotlin. Non-blocking.'
inputs:
  build-tool: { description: 'maven | gradle', default: 'maven' }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # Not every repo ships a wrapper: use it if present, otherwise the
        # runner's binary. Assuming ./mvnw would leave out a large part of the fleet.
        if [ "${{ inputs.build-tool }}" = "maven" ]; then
          MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw
          "$MVN" -B -q checkstyle:check pmd:check spotless:check || \
            echo "::warning::JVM lint has findings — review (does not block the merge)"
        else
          GRADLE=gradle; [ -x ./gradlew ] && GRADLE=./gradlew
          "$GRADLE" --no-daemon detekt ktlintCheck || \
            echo "::warning::Kotlin lint has findings — review (does not block the merge)"
        fi
