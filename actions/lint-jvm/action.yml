name: 'Lint JVM'
description: 'Checkstyle, PMD y Spotless en Maven; detekt y ktlint en Kotlin. No bloqueante.'
inputs:
  build-tool: { description: 'maven | gradle', default: 'maven' }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # No todos los repos traen wrapper: se usa si está, y si no el binario
        # del runner. Asumir ./mvnw deja fuera a buena parte del parque.
        if [ "${{ inputs.build-tool }}" = "maven" ]; then
          MVN=mvn; [ -x ./mvnw ] && MVN=./mvnw
          "$MVN" -B -q checkstyle:check pmd:check spotless:check || \
            echo "::warning::lint JVM con hallazgos — revisar (no bloquea el merge)"
        else
          GRADLE=gradle; [ -x ./gradlew ] && GRADLE=./gradlew
          "$GRADLE" --no-daemon detekt ktlintCheck || \
            echo "::warning::lint Kotlin con hallazgos — revisar (no bloquea el merge)"
        fi
