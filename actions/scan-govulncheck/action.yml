name: 'govulncheck (SCA with reachability, Go)'
description: >
  Only reports vulnerabilities in functions the code actually reaches, so it
  rarely gives false positives. Requires the Go toolchain in the job
  (actions/setup-go) and compiles the module. Emits SARIF and never fails on
  its own: the gate decides.
inputs:
  version:
    description: 'govulncheck version'
    default: 'v1.9.0'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p reports
        # go install verifies the module against sum.golang.org
        GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${VERSION}"
        # with -format sarif the exit code is 0 even when there are findings
        "$RUNNER_TEMP/bin/govulncheck" -format sarif ./... > reports/govulncheck.sarif || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: sarif-govulncheck, path: reports/govulncheck.sarif, if-no-files-found: warn, retention-days: 1 }
