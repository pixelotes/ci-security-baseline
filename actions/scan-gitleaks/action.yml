name: 'Gitleaks (secrets in the diff)'
description: >
  Scans only the PR diff. Fast but with many false positives, so it reports
  and does not block on its own. The real blocking comes from verified
  TruffleHog in the nightly run.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p reports bin
        VER=8.28.0
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
          | tar -xz -C bin gitleaks
        BASE="${{ github.event.pull_request.base.sha }}"
        RANGE=""
        if [ -n "$BASE" ]; then RANGE="--log-opts=${BASE}..HEAD"; fi
        ./bin/gitleaks detect --source . --no-banner --redact \
          --config "${{ github.action_path }}/../../policy/gitleaks.toml" \
          --report-format sarif --report-path reports/gitleaks.sarif \
          $RANGE || true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with: { name: sarif-gitleaks, path: reports/gitleaks.sarif, if-no-files-found: warn, retention-days: 1 }
