# The baseline's own rules. They complement the public rulesets
# (p/ci, p/secrets and the language one), they do not replace them.
rules:
  - id: baseline-azure-connection-string
    languages: [generic]
    severity: ERROR
    message: >
      Azure connection string embedded in the code. Secrets live in Key Vault
      and are retrieved via OIDC; they are not injected into the repository.
    metadata:
      security-severity: '9.1'
      category: security
    pattern-regex: '(?i)(DefaultEndpointsProtocol|AccountKey|SharedAccessSignature)=[^;\s"'']{10,}'

  - id: baseline-github-oidc-wildcard-subject
    languages: [yaml]
    severity: ERROR
    message: >
      Federated credential with an overly broad subject. It must be scoped to
      an environment (repo:ORG/REPO:environment:prod); with a wildcard, a
      workflow triggered by a pull request gets a production token.
    metadata:
      security-severity: '8.8'
      category: security
    pattern-regex: 'subject:\s*[''"]?repo:[^:\s]+/[^:\s]+:(\*|ref:refs/heads/\*)'

  - id: baseline-workflow-id-token-in-pr
    languages: [yaml]
    severity: WARNING
    message: >
      id-token write in a workflow that pull_request can trigger. Without that
      permission no OIDC token is possible: it is the defense in depth that
      protects Key Vault even if Entra is misconfigured.
    metadata:
      security-severity: '6.5'
      category: security
    patterns:
      - pattern-regex: 'on:[\s\S]{0,400}pull_request'
      - pattern-regex: 'id-token:\s*write'

  - id: baseline-unpinned-third-party-action
    languages: [yaml]
    severity: WARNING
    message: >
      Third-party action pinned by tag. A tag is mutable: a compromise of the
      upstream account propagates to every repo on the next build. Pin by full
      SHA (bin/pin-actions.sh does it).
    metadata:
      security-severity: '5.9'
      category: supply-chain
    pattern-regex: 'uses:\s+(?!pixelotes/|\./)[\w.-]+/[\w.-]+@v?\d[\w.-]*\s*$'
