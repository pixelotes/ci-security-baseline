# Severity normalization across tools.
#
# Each scanner uses its own scale: Trivy speaks CVSS, Semgrep speaks
# ERROR/WARNING, Checkov speaks in checks. Without this table, "high" means
# different things in each SARIF and the gate cannot decide consistently.
#
# Order of precedence inside the gate:
#   1. overrides from this table (glob pattern on the ruleId)
#   2. properties.security-severity (CVSS), if present
#   3. the tool's textual severity label
#   4. levels from this table, based on the SARIF level

levels:
  error: high
  warning: medium
  note: low
  none: info

overrides:
  # A secret verified against the provider is true by definition.
  trufflehog:
    '*': critical

  # Gitleaks works on the diff and has false positives; it reports high but
  # not critical. The real blocking of secrets comes from trufflehog in the nightly.
  gitleaks:
    '*': high

  semgrep: &sast-overrides
    '*.security.*': high
    'generic.secrets.*': high

  # Opengrep reads the same rules and names them the same way
  opengrep: *sast-overrides

  checkov:
    # public exposure of resources: not up for debate
    'CKV_AZURE_*_public_*': critical
    'CKV_AWS_*_public_*': critical

  hadolint:
    'DL3002': medium   # last user is root
    'DL3008': low      # unpinned versions in apt
    'DL3018': low      # unpinned versions in apk
