# Central Gitleaks allowlist for the organization's baseline.
#
# PER-REPOSITORY exceptions do not go here: they go in the repo's
# .security-baseline.yml, where they carry an owner and an expiry date. This
# file is only for corporate patterns that would be false positives in any repo.

[extend]
useDefault = true

[[rules]]
id = "baseline-internal-token"
description = "Organization internal service token"
regex = '''(?i)acme_(sk|pat)_[a-z0-9]{32,}'''
tags = ["internal", "token"]

[allowlist]
description = "Corporate false positives"
paths = [
  '''(.*?)(test|tests|spec|fixtures|__mocks__)(/|\\).*''',
  '''(.*?)\.(md|adoc|svg|lock)$''',
  # demo repo with planted findings, on purpose
  '''(^|/)examples/.*''',
  '''(.*?)package-lock\.json$''',
  '''(.*?)yarn\.lock$''',
]
regexes = [
  # Organization-specific patterns (phishing simulation domains, internal
  # token prefixes) do NOT go here: this file is versioned and would document
  # in plain text exactly what should not be published.
  # Put them in policy/gitleaks.local.toml, outside version control.
  '''EXAMPLE[_-]?KEY''',
  '''00000000-0000-0000-0000-000000000000''',
]
