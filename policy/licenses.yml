# License policy. It is applied in two places:
#   - Trivy on the PR (quick warning about what the change introduces)
#   - Dependency-Track continuously (system of record and evidence)
#
# Azure Artifacts does not evaluate licenses: it is the third Xray capability
# that has to be replaced explicitly when migrating.

permitidas:
  - Apache-2.0
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - EPL-2.0
  - MPL-2.0
  - CC0-1.0
  - Unlicense
  - PSF-2.0

revisar:            # require case-by-case approval
  - LGPL-2.1
  - LGPL-3.0
  - CDDL-1.0
  - EPL-1.0

prohibidas:         # block publication in CD
  - AGPL-3.0
  - GPL-2.0
  - GPL-3.0
  - SSPL-1.0
  - BUSL-1.1
  - Commons-Clause
  - NONE             # no declared license
